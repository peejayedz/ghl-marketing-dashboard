name: Refresh GHL dashboard data

on:
  schedule:
    # Runs daily at 12:00 UTC. Adjust to taste (cron is UTC, not local time).
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest GHL stats
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python scripts/fetch_stats.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json
          git diff --quiet --cached || git commit -m "Auto-refresh dashboard data"
          git push
